# Aventura — production/staging stack.
# Usage:
#   cp .env.production.example .env    (điền giá trị thật, xem docs/setup/production-deploy.md)
#   docker compose up -d --build
#   docker compose exec app php artisan migrate --force
#
# Container `app` (từ Dockerfile) chạy: nginx + php-fpm + 2 queue worker + scheduler + reverb
# qua supervisord. Các service phụ trợ (mysql/redis/meilisearch) chạy riêng bên dưới.
# Caddy đóng vai trò reverse proxy + SSL termination tự động (Let's Encrypt).

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # CADDY — Reverse Proxy + SSL/TLS tự động (Let's Encrypt)
  # ─────────────────────────────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 (QUIC)
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # Lưu certificate Let's Encrypt
      - caddy_config:/config
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2019/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────────────────────────────────────────
  # APP — Laravel (Nginx + PHP-FPM + Queue Worker + Scheduler + Reverb)
  # ─────────────────────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      target: production
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      meilisearch:
        condition: service_started
    env_file: .env
    # Không expose port trực tiếp ra host — Caddy làm reverse proxy
    expose:
      - "80"
      - "8080"
    volumes:
      - app_storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ─────────────────────────────────────────────────────────────────────────────
  # MYSQL 8 — Database chính
  # ─────────────────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --innodb-buffer-pool-size=512M
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-aventura}
      MYSQL_USER: ${DB_USERNAME:-aventura}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────────────────────────────────────
  # REDIS 7 — Cache + Queue + Session + Pub/Sub
  # ─────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass "${REDIS_PASSWORD}"
      --maxmemory 256mb
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────────────────────────────────────────
  # MEILISEARCH — Full-text search
  # ─────────────────────────────────────────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.6
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY}
      MEILI_ENV: production
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────────────────
  # PYTHON MICROSERVICES
  # ─────────────────────────────────────────────────────────────────────────────
  email-service:
    build:
      context: ./services/email_service
    restart: unless-stopped
    expose:
      - "8001"
    environment:
      BREVO_API_KEY: ${BREVO_API_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  chatbot-service:
    build:
      context: ./services/chatbot_service
    restart: unless-stopped
    expose:
      - "8002"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-aventura}
      DB_USERNAME: ${DB_USERNAME:-aventura}
      DB_PASSWORD: ${DB_PASSWORD}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  analytics-service:
    build:
      context: ./services/analytics_service
    restart: unless-stopped
    expose:
      - "8003"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-aventura}
      DB_USERNAME: ${DB_USERNAME:-aventura}
      DB_PASSWORD: ${DB_PASSWORD}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

# ─────────────────────────────────────────────────────────────────────────────
# VOLUMES
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  mysql_data:
  redis_data:
  meili_data:
  app_storage:
  caddy_data:
  caddy_config:
